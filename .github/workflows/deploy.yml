# Build, scan, publish, and tell the portal the image exists.
#
# The last step is deliberately not a commit into the gitops repository. Which
# environments a branch feeds is the portal's knowledge -- one branch can serve
# more than one, and adding an environment must not mean editing every app's
# workflow. So the workflow reports the image and the portal writes the tag into
# the gitops repository, where Argo CD picks it up exactly as before.
#
# Lives in .github/workflows because that is what GitHub Actions reads, and
# Forgejo Actions reads it too -- one file, either forge.
name: Deploy

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  # A second push while the first is still building makes the first pointless.
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "tag=$(date +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.REGISTRY }}/${{ vars.APP_SLUG }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          # Loaded locally first: scanning an image that was already pushed is
          # scanning something the world can already pull.
          load: true
          push: false
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max

      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          format: table
          # Warns by default and fails only on what the app has been set to
          # block on. A scanner that fails the build on every medium finding
          # gets switched off within a week, which is worse than warning.
          exit-code: '1'
          ignore-unfixed: true
          severity: ${{ vars.TRIVY_SEVERITY || 'CRITICAL' }}

      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache

      - name: Hand the image to the portal
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "${{ vars.PORTAL_URL }}/api/v1/integrations/ci/builds" \
            -H "Authorization: Bearer ${{ secrets.PORTAL_TOKEN }}" \
            -H 'Content-Type: application/json' \
            -d @- <<JSON
          {
            "repository": "${{ github.repository }}",
            "ref": "${{ github.ref }}",
            "commit": "${{ github.sha }}",
            "commit_message": $(printf '%s' "${{ github.event.head_commit.message }}" | jq -Rs .),
            "image": "${{ steps.meta.outputs.image }}",
            "tag": "${{ steps.meta.outputs.tag }}",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}"
          }
          JSON
